name: Enzai
description: >-
  Enzai is an enterprise AI governance platform that helps organizations adopt
  AI while managing regulatory and operational risk. Its product suite spans
  agentic AI governance (real-time analysis, risk flagging, and agent-sprawl
  management), AI use-case intake and approval workflows, a centralized AI
  registry inventorying first- and third-party AI systems, and compliance
  frameworks that map AI initiatives to the EU AI Act, GDPR, NIST AI RMF, and
  ISO/IEC 42001. Enzai is headquartered in Belfast with a London office, is ISO
  27001 certified, and is backed by venture capital including Seedcamp. No
  public API or developer portal is published at this time.
